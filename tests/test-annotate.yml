name: Test annotate feature with failed tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture CTRF report with failures to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/ctrf-with-failures.json" "$GITHUB_WORKSPACE/ctrf-report.json"

      - id: action
        uses: .
        with:
          report-path: ctrf-report.json
          summary-report: true
          annotate: true
          title: 'Annotated Failures Report'

      - name: Assert action completed successfully with annotations enabled
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "summary (first 300 chars): ${SUMMARY:0:300}"
          echo "report (first 200 chars): ${REPORT:0:200}"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: expected report output to be non-empty"
            exit 1
          fi
          echo "PASS: action completed with annotate=true and outputs are present"
