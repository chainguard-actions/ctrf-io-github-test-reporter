name: Test skipped tests report
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report-path: tests/fixtures/ctrf-with-skipped.json
          summary-report: true
          skipped-report: true
          title: 'Skipped Tests Report'

      - name: Assert summary output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "actual summary (first 300 chars): ${ACTUAL:0:300}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          echo "PASS: summary output is non-empty"

      - name: Assert summary mentions skipped tests
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "Checking summary mentions skipped tests..."
          if ! echo "$ACTUAL" | grep -qi "skip\|2"; then
            echo "FAIL: summary does not appear to mention skipped tests"
            echo "Summary: $ACTUAL"
            exit 1
          fi
          echo "PASS: summary mentions skipped tests"

      - name: Assert report output contains skipped count
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "actual report (first 300 chars): ${ACTUAL:0:300}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected report output to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q '"skipped"'; then
            echo "FAIL: report does not contain skipped field"
            exit 1
          fi
          echo "PASS: report contains skipped field"
