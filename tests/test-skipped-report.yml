name: Test skipped-report with skipped tests
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create CTRF report with skipped tests
        run: |
          cat > /tmp/ctrf-skipped.json << 'EOF'
          {
            "results": {
              "tool": { "name": "jest" },
              "summary": {
                "tests": 4,
                "passed": 2,
                "failed": 0,
                "pending": 0,
                "skipped": 2,
                "other": 0,
                "start": 1722511783500,
                "stop": 1722511784500
              },
              "tests": [
                {
                  "name": "should login",
                  "status": "passed",
                  "duration": 100,
                  "filePath": "tests/auth.test.ts",
                  "suite": "auth.test.ts > login"
                },
                {
                  "name": "should logout",
                  "status": "skipped",
                  "duration": 0,
                  "filePath": "tests/auth.test.ts",
                  "suite": "auth.test.ts > login"
                },
                {
                  "name": "should validate settings",
                  "status": "passed",
                  "duration": 150,
                  "filePath": "tests/settings.test.ts",
                  "suite": "settings.test.ts > settings"
                },
                {
                  "name": "should update profile",
                  "status": "skipped",
                  "duration": 0,
                  "filePath": "tests/profile.test.ts",
                  "suite": "profile.test.ts > profile"
                }
              ]
            }
          }
          EOF

      - id: action
        uses: .
        with:
          report-path: /tmp/ctrf-skipped.json
          skipped-report: true
          summary: true
          annotate: false

      - name: Assert summary output contains skipped test information
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary (first 500 chars): ${SUMMARY:0:500}"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          if echo "$SUMMARY" | grep -qi "skip\|logout\|profile"; then
            echo "PASS: summary contains expected skipped test content"
          else
            echo "FAIL: summary does not contain expected skipped test content"
            echo "Full summary: $SUMMARY"
            exit 1
          fi
