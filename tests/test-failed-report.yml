name: Test failed tests report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report-path: tests/fixtures/ctrf-failing.json
          failed-report: true
          summary-report: true
          title: 'Failed Tests Report'

      - name: Assert summary output is non-empty
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary (first 300 chars): ${SUMMARY:0:300}"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          echo "PASS: summary output is non-empty"

      - name: Assert summary contains failed test info
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "Checking summary contains failure information..."
          # The report has 2 failed tests - check the count appears
          if ! echo "$SUMMARY" | grep -q "2"; then
            echo "FAIL: summary does not contain expected failed count (2)"
            exit 1
          fi
          echo "PASS: summary contains failure count"

      - name: Assert report JSON contains failed tests
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report (first 300 chars): ${REPORT:0:300}"
          if [ -z "$REPORT" ]; then
            echo "FAIL: expected report output to be non-empty"
            exit 1
          fi
          if ! echo "$REPORT" | grep -q "failed"; then
            echo "FAIL: report does not contain 'failed' status"
            exit 1
          fi
          echo "PASS: report contains failed test information"
