name: Test glob pattern for report-path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report-path: tests/fixtures/ctrf-all-*.json
          summary-report: true
          title: 'Glob Pattern Test'

      - name: Assert summary output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "actual summary (first 300 chars): ${ACTUAL:0:300}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected summary output to be non-empty when using glob pattern"
            exit 1
          fi
          echo "PASS: summary output is non-empty with glob pattern"

      - name: Assert report output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "actual report (first 300 chars): ${ACTUAL:0:300}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected report output to be non-empty when using glob pattern"
            exit 1
          fi
          echo "PASS: report output is non-empty with glob pattern"
