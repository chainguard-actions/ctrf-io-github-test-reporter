name: Test glob pattern for report-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report-path: tests/fixtures/ctrf-all-passed.json
          summary-report: true
          test-report: true

      - name: Assert summary output is non-empty
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary length: ${#SUMMARY}"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          echo "PASS: summary output is present"

      - name: Assert report output contains test data
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: expected report output to be non-empty"
            exit 1
          fi
          # Verify the report contains expected test count info
          if ! echo "$REPORT" | python3 -m json.tool > /dev/null 2>&1; then
            echo "FAIL: report output is not valid JSON"
            exit 1
          fi
          echo "PASS: report output is valid JSON and non-empty"
