name: Test test-report output
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy CTRF report fixture
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/ctrf-passed.json" /tmp/ctrf-passed.json

      - id: action
        uses: .
        with:
          report-path: /tmp/ctrf-passed.json
          test-report: true
          summary: true
          annotate: false

      - name: Assert summary output contains test names
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary (first 500 chars): ${SUMMARY:0:500}"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          # The test report should mention tests
          if echo "$SUMMARY" | grep -qi "passed\|test\|login\|dashboard"; then
            echo "PASS: summary contains expected test content"
          else
            echo "FAIL: summary does not contain expected test content"
            echo "Full summary: $SUMMARY"
            exit 1
          fi
