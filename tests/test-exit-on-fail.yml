name: Test exit-on-fail with failing tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          report-path: tests/fixtures/ctrf-report-with-failures.json
          summary-report: true
          summary: true
          annotate: false
          exit-on-fail: true

      - name: Assert action failed due to test failures
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed because tests failed and exit-on-fail is true"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed because tests failed and exit-on-fail is true"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
