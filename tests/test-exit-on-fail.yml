name: Test exit-on-fail with failing tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report-path: tests/fixtures/ctrf-failing.json
          failed-report: true
          exit-on-fail: true
          annotate: false
        continue-on-error: true

      - name: Assert action failed due to failing tests
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when exit-on-fail=true and tests fail, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when tests failed with exit-on-fail=true"
