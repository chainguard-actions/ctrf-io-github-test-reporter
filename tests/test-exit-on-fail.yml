name: Test exit-on-fail behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with exit-on-fail and failing tests
        id: action
        uses: .
        continue-on-error: true
        with:
          report-path: tests/fixtures/ctrf-failing.json
          summary-report: true
          exit-on-fail: true

      - name: Assert action failed due to test failures
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly exited with failure when tests failed and exit-on-fail=true"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have exited with failure but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
