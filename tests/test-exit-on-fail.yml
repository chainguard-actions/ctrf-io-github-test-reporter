name: Test exit-on-fail behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture CTRF report with failures to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/ctrf-failed.json" "$GITHUB_WORKSPACE/ctrf-failed.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          report-path: ctrf-failed.json
          summary-report: true
          summary: true
          annotate: false
          exit-on-fail: true

      - name: Assert action failed due to test failures
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when exit-on-fail=true and tests fail, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when exit-on-fail=true and tests failed"
