name: Test exit-on-fail behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with exit-on-fail on a report with failures
        id: action
        uses: .
        continue-on-error: true
        with:
          report-path: tests/fixtures/ctrf-with-failures.json
          failed-report: true
          exit-on-fail: true

      - name: Assert action failed due to test failures
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when exit-on-fail=true and tests fail, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly exited with failure when tests failed"
