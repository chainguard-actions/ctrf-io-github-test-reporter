name: Test custom template-path report
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report-path: tests/fixtures/ctrf-all-passed.json
          template-path: tests/fixtures/custom-template.hbs
          custom-report: true
          title: 'Custom Template Report'

      - name: Assert summary output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "actual summary (first 300 chars): ${ACTUAL:0:300}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          echo "PASS: summary output is non-empty"

      - name: Assert summary contains custom template content
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "Checking summary contains custom template output..."
          if ! echo "$ACTUAL" | grep -qi "Custom Test Report\|Total Tests\|Passed\|passed"; then
            echo "FAIL: summary does not appear to contain custom template content"
            echo "Summary: $ACTUAL"
            exit 1
          fi
          echo "PASS: summary contains expected custom template content"
