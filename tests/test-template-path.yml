name: Test custom template-path report
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy CTRF report and template to tmp
        run: |
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/ctrf-passed.json" /tmp/ctrf-report.json
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/custom-template.hbs" /tmp/custom-template.hbs

      - id: action
        uses: .
        with:
          report-path: /tmp/ctrf-report.json
          template-path: /tmp/custom-template.hbs
          custom-report: true
          summary: true
          annotate: false

      - name: Assert summary output is non-empty
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary output length: ${#SUMMARY}"
          echo "summary (first 300 chars): ${SUMMARY:0:300}"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected summary output to be non-empty when using template-path"
            exit 1
          fi
          echo "PASS: summary output is non-empty with custom template"

      - name: Assert report output is non-empty
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report output length: ${#REPORT}"
          if [ -z "$REPORT" ]; then
            echo "FAIL: expected report output to be non-empty"
            exit 1
          fi
          echo "PASS: report output is non-empty"
