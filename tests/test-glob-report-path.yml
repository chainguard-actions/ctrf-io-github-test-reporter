name: Test glob pattern for report-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy multiple fixture CTRF reports to workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ctrf-results"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ctrf-passed.json" "$GITHUB_WORKSPACE/ctrf-results/report-1.json"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ctrf-passed.json" "$GITHUB_WORKSPACE/ctrf-results/report-2.json"

      - id: action
        uses: .
        with:
          report-path: ctrf-results/*.json
          summary-report: true
          summary: true
          annotate: false

      - name: Assert summary output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "actual summary (first 500 chars): ${ACTUAL:0:500}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected summary output to be non-empty when using glob pattern"
            exit 1
          fi
          echo "PASS: summary output is non-empty with glob pattern"

      - name: Assert report output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "actual report (first 300 chars): ${ACTUAL:0:300}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected report output to be non-empty"
            exit 1
          fi
          echo "PASS: report output is non-empty"
