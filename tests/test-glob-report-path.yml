name: Test glob pattern for report-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple CTRF report files matching a glob pattern
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ctrf-all-passed.json" "$GITHUB_WORKSPACE/test-results/ctrf-report-1.json"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ctrf-all-passed.json" "$GITHUB_WORKSPACE/test-results/ctrf-report-2.json"

      - id: action
        uses: .
        with:
          report-path: test-results/ctrf-report-*.json
          summary-report: true
          title: 'Glob Pattern Test'

      - name: Assert summary output is non-empty
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary (first 500 chars): ${SUMMARY:0:500}"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected summary output to be non-empty when using glob pattern"
            exit 1
          fi
          echo "PASS: summary output is present with glob pattern"

      - name: Assert report output is non-empty
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report (first 200 chars): ${REPORT:0:200}"
          if [ -z "$REPORT" ]; then
            echo "FAIL: expected report output to be non-empty"
            exit 1
          fi
          echo "PASS: report output is present"
