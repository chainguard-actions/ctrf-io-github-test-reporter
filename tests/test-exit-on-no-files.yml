name: Test exit-on-no-files behavior
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          report-path: /tmp/nonexistent-ctrf-report-*.json
          summary: true
          annotate: false
          exit-on-no-files: true

      - name: Assert action failed due to no files found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly exited with failure when no CTRF files found and exit-on-no-files=true"
          else
            echo "FAIL: expected action to fail when exit-on-no-files=true and no files exist, got: $OUTCOME"
            exit 1
          fi
