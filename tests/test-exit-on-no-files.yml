name: Test exit-on-no-files behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          report-path: nonexistent-ctrf-report-*.json
          summary-report: true
          exit-on-no-files: true

      - name: Assert action failed due to no files found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly exited with failure because no test files were found"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to exit-on-no-files=true with no matching files"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
