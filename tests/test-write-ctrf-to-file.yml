name: Test write-ctrf-to-file feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture CTRF report to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/ctrf-all-passed.json" "$GITHUB_WORKSPACE/ctrf-report.json"

      - id: action
        uses: .
        with:
          report-path: ctrf-report.json
          summary-report: true
          write-ctrf-to-file: processed-ctrf-output.json

      - name: Assert processed CTRF file was written
        run: |
          echo "Checking for processed CTRF output file..."
          if [ ! -f "$GITHUB_WORKSPACE/processed-ctrf-output.json" ]; then
            echo "FAIL: expected processed CTRF file 'processed-ctrf-output.json' was not created"
            exit 1
          fi
          echo "File exists. Contents (first 200 chars):"
          head -c 200 "$GITHUB_WORKSPACE/processed-ctrf-output.json"
          echo ""
          echo "PASS: processed CTRF file was created"

      - name: Assert processed CTRF file is valid JSON
        run: |
          if ! python3 -c "import json, sys; json.load(open('$GITHUB_WORKSPACE/processed-ctrf-output.json'))" 2>/dev/null; then
            echo "FAIL: processed CTRF file is not valid JSON"
            exit 1
          fi
          echo "PASS: processed CTRF file is valid JSON"

      - name: Assert summary output is non-empty
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary (first 200 chars): ${SUMMARY:0:200}"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: expected summary output to be non-empty"
            exit 1
          fi
          echo "PASS: summary output is present"
