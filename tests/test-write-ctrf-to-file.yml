name: Test write-ctrf-to-file option
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          report-path: tests/fixtures/ctrf-all-passed.json
          summary-report: true
          write-ctrf-to-file: /tmp/output-ctrf-report.json

      - name: Assert output CTRF file was written
        run: |
          echo "Checking if output CTRF file was written..."
          if [ ! -f /tmp/output-ctrf-report.json ]; then
            echo "FAIL: expected output CTRF file at /tmp/output-ctrf-report.json but it was not found"
            exit 1
          fi
          echo "PASS: output CTRF file exists"

      - name: Assert output CTRF file is valid JSON with results
        run: |
          CONTENT=$(cat /tmp/output-ctrf-report.json)
          echo "Output file content (first 200 chars): ${CONTENT:0:200}"
          if ! echo "$CONTENT" | grep -q '"results"'; then
            echo "FAIL: output CTRF file does not contain 'results' key"
            exit 1
          fi
          echo "PASS: output CTRF file contains results key"
